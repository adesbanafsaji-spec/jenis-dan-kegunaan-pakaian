<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1f14;touch-action:manipulation;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b1b1b;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#app{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#FFF8E1}
.view{position:absolute;left:0;top:0;right:0;bottom:0}
.view.leave{opacity:0;transform:scale(.98);transition:opacity .18s,transform .18s}
.view.enter-fwd{animation:inR .36s ease both}
.view.enter-back{animation:inL .36s ease both}
.view.enter-fade{animation:inF .5s ease both}
@keyframes inR{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.shake{animation:shake .45s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app">
  <div id="stage">
    <div id="view" class="view"></div>
    <button id="full" class="hidden" data-act="full" aria-label="Layar penuh">⛶</button>
    <button id="mute" class="hidden" data-act="mute" aria-label="Musik latar">🔊</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ====== Util ====== */
var $ = function(s){ return document.querySelector(s); };
var app = $('#app'), stage = $('#stage'), view = $('#view'), muteBtn = $('#mute'), fullBtn = $('#full');
var fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var mem = {};
function sget(k){ try{ var v = localStorage.getItem(k); return v===null ? (mem[k]||null) : v; }catch(e){ return mem[k]||null; } }
function sset(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rep(s,n){ var r=''; for(var i=0;i<n;i++) r+=s; return r; }
function shake(el){ if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(function(){ el.classList.remove('shake'); },500); }
var NW = ['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh'];
function nw(n){ return NW[n] || String(n); }
function countWords(n){ var r=[]; for(var i=1;i<=n;i++) r.push(nw(i)); return r.join(', '); }

/* ====== Skala 16:9 ====== */
function fit(){
  var w = app.clientWidth || window.innerWidth, h = app.clientHeight || window.innerHeight;
  stage.style.transform = 'translate(-50%,-50%) scale(' + Math.min(w/1280, h/720) + ')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit,200); });
document.addEventListener('fullscreenchange', function(){ setTimeout(fit,100); });
document.addEventListener('webkitfullscreenchange', function(){ setTimeout(fit,100); });
['gesturestart','gesturechange','contextmenu','dragstart'].forEach(function(ev){ document.addEventListener(ev, function(e){ e.preventDefault(); }); });
fit();

/* ====== Audio: musik latar otomatis berhenti saat ada suara, lalu lanjut ====== */
var BGM_VOL = 0.12;
var bgm = new Audio('./assets/musiklatar.mp3'); bgm.loop = true; bgm.preload = 'auto'; bgm.volume = BGM_VOL;
var sfxOk = new Audio('./assets/benar.mp3'); sfxOk.preload = 'auto';
var sfxNo = new Audio('./assets/salah.mp3'); sfxNo.preload = 'auto';
var music = true, started = false, holds = 0, resumeT = null;
function playEl(a){ try{ var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} }
function resumeBgm(){
  clearTimeout(resumeT);
  resumeT = setTimeout(function(){
    if(holds === 0 && music && started && !document.hidden) playEl(bgm);
  }, 300);
}
/* hold(): musik latar berhenti selama ada penahan aktif; release() bersifat idempoten */
function hold(){
  var released = false;
  holds++; clearTimeout(resumeT);
  try{ bgm.pause(); }catch(e){}
  return function(){
    if(released) return; released = true;
    holds = Math.max(0, holds - 1);
    if(holds === 0) resumeBgm();
  };
}
var spFin = null, spTimer = null;
function stopSpeech(){
  var f = spFin; spFin = null; clearTimeout(spTimer);
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  if(f) f();
}
function say(t){
  if(!t || !('speechSynthesis' in window)) return;
  var rel = hold();
  stopSpeech();
  spFin = rel;
  var u;
  try{ u = new SpeechSynthesisUtterance(t); }catch(e){ rel(); return; }
  u.lang = 'id-ID'; u.rate = 0.85; u.volume = 1;
  var end = function(){ if(spFin === rel){ spFin = null; clearTimeout(spTimer); } rel(); };
  u.onend = end; u.onerror = end;

/* ====== Transisi ====== */
var busy = false;
function show(html, dir, after){
  if(busy) return;
  busy = true; stopAll();
  var delay = view.innerHTML ? 180 : 0;
  view.classList.add('leave');
  setTimeout(function(){
    view.innerHTML = ic(html);
    view.className = 'view enter-' + (dir || 'fwd');
    if(after) after();
    setTimeout(function(){ view.className = 'view'; busy = false; }, 380);
  }, delay);
}
function chrome(on){ muteBtn.classList.toggle('hidden', !on); fullBtn.classList.toggle('hidden', !on || !fsOK); }

/* ====== Cover, nama, menu ====== */
function coverHTML(){ return '<div class="cover" data-act="cover"><div class="cover-hint">sentuh mana saja untuk masuk</div></div>'; }
function nameHTML(){
  var rows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  var kb = rows.map(function(r,k){
    var keys = r.split('').map(function(c){ return '<button class="key" data-act="key" data-k="' + c + '">' + c + '</button>'; }).join('');
    if(k === 2) keys += '<button class="key wide" data-act="key" data-k="BS" aria-label="Hapus huruf">⌫</button>';
    return '<div class="krow">' + keys + '</div>';
  }).join('') + '<div class="krow"><button class="key space" data-act="key" data-k="SP">spasi</button><button class="key wide2" data-act="key" data-k="CLR">Hapus semua</button></div>';
  return '<div class="page bg1"><div class="namecard"><div class="h1">🧒 Siapa namamu?</div>' +
    '<input id="nm" type="text" inputmode="none" maxlength="20" placeholder="Sentuh huruf di bawah" value="' + esc(state.name) + '" autocomplete="off" aria-label="Nama">' +
    '<div class="err" id="err"></div>' + kb +
    '<button class="btn primary big" style="min-height:70px;margin-top:4px" data-act="start">Masuk ▶</button></div></div>';
}
function menuHTML(){
  function b(c,act,i,t,s){ return '<button class="mbtn ' + c + '" data-act="' + act + '"><span class="mi">' + i + '</span><span>' + t + '<small>' + s + '</small></span></button>'; }
  return '<div class="menu bg1"><div class="mtop panel"><div class="h1" style="font-size:46px">Halo, ' + esc(state.name) + '! 👋</div>' +
    '<div class="sub">Ayo belajar pakaian. Pilih menu:</div></div><div class="mgrid">' +
    b('m1','learnL','📖','Belajar Literasi','Jenis dan kegunaan pakaian') +
    b('m2','learnN','🔢','Belajar Numerasi','Berhitung dan mengelompokkan') +
    b('m3','playL','🎈','Bermain Literasi','Latihan soal bergambar') +
    b('m4','playN','🧮','Bermain Numerasi','Latihan berhitung') +
    b('m5','rank','🏆','Papan Peringkat','Skor semua peserta') +

    '</div><div class="mfoot"><button class="btn ghost" data-act="rename">↩ Ganti nama</button></div></div>';
}
function toMenu(dir){ state.mode = ''; chrome(true); show(menuHTML(), dir || 'fwd'); }

/* ====== Shell navigasi ====== */
function shell(o){
  return '<div class="shell ' + o.bg + '"><div class="topbar"><button class="btn ghost" data-act="home">🏠 Menu</button><div class="prog">' + o.prog + '</div></div>' +
    '<div class="content">' + o.inner + '</div><div class="nav"><button class="btn nav-btn" data-act="prev">◀ Kembali</button>' +
    '<div class="hint" id="hint">' + (o.hint || '') + '</div>' +
    (o.hideNext ? '<div class="spacer"></div>' : '<button class="btn primary nav-btn' + (o.locked ? ' locked' : '') + '" id="next" data-act="next">' + (o.nextLabel || 'Lanjut ▶') + '</button>') + '</div></div>';
}
function unlockNext(msg){
  var n = $('#next'); if(n) n.classList.remove('locked');
  var h = $('#hint'); if(h) h.textContent = msg || 'Hebat! Tekan Lanjut ▶';
}
/* type: good/bad dengan suara benar/salah lalu penjelasan; neutral tanpa suara */
function setFb(type, html, sayText){
  var el = $('#fb'); if(!el) return;
  el.className = 'fb ' + (type === 'neutral' ? '' : type);
  el.innerHTML = ic('<span class="fbi">' + (type==='good' ? '✅' : type==='bad' ? '❌' : '👆') + '</span><div class="fbt">' + html + '</div>' + (sayText ? sayBtn(sayText) : ''));
  if(type === 'good') fbAudio(true, sayText);
  else if(type === 'bad') fbAudio(false, sayText);
}
function rowHTML(r){
  if(!r) return '';
  var len = Array.from(r.replace(/<[^>]*>/g,'')).length;
  return '<div class="picrow' + (len > 9 ? ' s' : '') + '">' + r + '</div>';
}
function optHTML(o,k,solved,act,hasRow){
  var cls = 'opt';
  if(!o.e) cls += /^\d+$/.test(o.n) ? ' num' : ' txt';
  else if(Array.from(o.e).length > 4) cls += ' rowopt';
  if(hasRow) cls += ' cmp';
  if(solved) cls += o.ok ? ' ok lock' : ' lock';
  return '<button class="' + cls + '" data-act="' + act + '" data-i="' + k + '" aria-label="' + esc(o.n || o.e) + '">' +
    (o.e ? '<span class="oe">' + o.e + '</span>' : '') + (o.n && o.e ? '<span class="on">' + esc(o.n) + '</span>' : (!o.e ? '<span class="on">' + esc(o.n) + '</span>' : '')) + '</button>';
}
function qHTML(q, solved, act){
  var okOpt = null; q.opts.forEach(function(o){ if(o.ok && !okOpt) okOpt = o; });
  var spoken = q.prompt + ' ' + q.opts.map(function(o){ return o.n; }).filter(Boolean).join(', ') + '.';
  var fb = solved
    ? '<div class="fb good" id="fb"><span class="fbi">✅</span><div class="fbt"><b>Benar!</b> ' + (okOpt.why || q.why || '') + '</div></div>'
    : '<div class="fb" id="fb"><span class="fbi">👆</span><div class="fbt">Sentuh jawabanmu.</div></div>';
  return '<div class="q">' + (q.pic ? '<div class="pic">' + q.pic + '</div>' : '') + '<div class="qt">' + esc(q.prompt) + '</div>' + sayBtn(spoken) + '</div>' +
    rowHTML(q.row) +
    '<div class="opts">' + q.opts.map(function(o,k){ return optHTML(o,k,solved,act,!!q.row && !!o.e); }).join('') + '</div>' + fb;
}

var BGL = {lit:'bg2', num:'bg3'};
function unlocked(i){ var st = steps()[i]; return !!(state.done[dk(i)] || st.auto); }
function stepHTML(i){
  var S = steps(), st = S[i], total = S.length, last = (i === total - 1);
  var inner = RENDER[st.t](st, i);
  var title = state.track === 'num' ? 'Numerasi' : 'Literasi';
  return shell({
    bg: BGL[state.track], inner: inner, locked: !unlocked(i),
    prog: '<div class="prog-text">Belajar ' + title + ' · Langkah ' + (i+1) + ' dari ' + total + '</div><div class="bar"><i style="width:' + ((i+1)/total*100) + '%"></i></div>',
    hint: unlocked(i) ? (last ? 'Tekan Selesai ✔' : 'Hebat! Tekan Lanjut ▶') : (st.hint || ''),
    nextLabel: last ? 'Selesai ✔' : 'Lanjut ▶'
  });
}
function go(i, dir){ state.step = i; state.sel = null; state.msel = null; state.mode = 'learn'; chrome(true); show(stepHTML(i), dir); }
function startLearn(track){
  state.track = track; state.sel = null; state.msel = null;
  go(0, 'fwd');
}

    '<div class="info" id="info"><div class="plain">👆 ' + def + '</div></div>';
};

RENDER.choice = function(st, i){ return qHTML(st, !!state.done[dk(i)], 'opt'); };

RENDER.match = function(st, i){
  st = st || steps()[state.step];
  var ML = MATCHES[st.m];
  var left = ML.map(function(m){ var it = byId[m.id], on = state.matched[m.id];
    return '<button class="mi2' + (on ? ' ok' : '') + (state.msel === m.id ? ' sel' : '') + '" data-act="mleft" data-id="' + m.id + '"><span class="e">' + it.e + '</span>' + esc(it.n) + '</button>'; }).join('');
  if(!state.mright[st.m]) state.mright[st.m] = shuffle(ML.map(function(m){ return m.id; }));
  var right = state.mright[st.m].map(function(id){ var m = ML.filter(function(x){ return x.id === id; })[0];
    return '<button class="mi2' + (state.matched[id] ? ' ok' : '') + '" data-act="mright" data-id="' + id + '"><span class="e">' + m.e + '</span>' + esc(m.n) + '</button>'; }).join('');
  var all = ML.every(function(m){ return state.matched[m.id]; });
  var qt = 'Jodohkan pakaian dengan kegunaannya. Sentuh pakaian, lalu sentuh ' + st.kw + ' dipakai.';
  return '<div class="q"><div class="qt">' + qt + '</div>' + sayBtn(qt) + '</div>' +
    '<div class="mcols"><div class="mcol">' + left + '</div><div class="mcol">' + right + '</div></div>' +
    '<div class="fb' + (all ? ' good' : '') + '" id="fb"><span class="fbi">' + (all ? '✅' : '👆') + '</span><div class="fbt">' +

};

RENDER.count = function(st, i){

      : '<div class="two"><div class="pane"><div class="pt">☀️ Panas</div><div class="pe">🧢</div><div class="pd">Topi melindungi kepala</div></div><div class="pane b"><div class="pt">❄️ Dingin</div><div class="pe">🧥 🧤</div><div class="pd">Jaket dan sarung tangan menghangatkan</div></div></div>') +
    '<div class="tips">' + (num ? '1️⃣ 2️⃣ 3️⃣ Berhitung membuat kita tahu jumlahnya' : '🧼 Pakaian dijaga tetap bersih dan rapi') + '</div>' +
    '<div class="btnrow"><button class="btn primary big" data-act="' + (num ? 'playN' : 'playL') + '">🎈 Ayo Bermain</button><button class="btn big" data-act="home">🏠 Menu</button></div>';
};

/* ====== Bermain (kuis) ====== */
function startQuiz(kind){
  Q.kind = kind; Q.list = kind === 'num' ? genNum() : genLit();
  Q.i = 0; Q.score = 0; Q.answered = false;
  state.mode = 'quiz'; chrome(true);
  show(quizHTML(), 'fwd');
}
function quizHTML(){
  var q = Q.list[Q.i], total = Q.list.length;
  return shell({
    bg: Q.kind === 'num' ? 'bg5' : 'bg4', inner: qHTML(q, false, 'qopt'), hint: 'Pilih jawabanmu', locked: true,
    prog: '<div class="prog-text">Bermain ' + (Q.kind === 'num' ? 'Numerasi' : 'Literasi') + ' · Soal ' + (Q.i+1) + ' dari ' + total + ' · ⭐ <span id="qscore">' + Q.score + '</span></div><div class="bar"><i style="width:' + ((Q.i+1)/total*100) + '%"></i></div>',
    nextLabel: (Q.i === total - 1) ? 'Lihat Hasil ▶' : 'Lanjut ▶'
  });
}
function onQuizOpt(btn){
  if(Q.answered) return;
  var q = Q.list[Q.i], o = q.opts[+btn.dataset.i], correct = null;
  q.opts.forEach(function(x){ if(x.ok) correct = x; });
  Q.answered = true;
  var all = view.querySelectorAll('.opt');
  for(var k = 0; k < all.length; k++){ all[k].classList.add('lock'); if(q.opts[k].ok) all[k].classList.add('ok'); }
  if(o.ok){ Q.score += 10; setFb('good', '<b>Benar!</b> ' + q.why, 'Benar! ' + q.why); }
  else { btn.classList.add('no'); setFb('bad', '<b>Belum tepat.</b> Jawaban yang benar: <b>' + esc(correct.n || 'yang bertanda ✔') + '</b>. ' + q.why, 'Belum tepat. ' + q.why); }
  var sc = $('#qscore'); if(sc) sc.textContent = Q.score;
  unlockNext('Tekan Lanjut ▶');
}

/* ====== Peringkat ====== */
function loadRank(){ try{ var r = JSON.parse(sget(RANKKEY) || '[]'); return Array.isArray(r) ? r : []; }catch(e){ return []; } }
function tot(x){ return (x.lit || 0) + (x.num || 0); }
function sortedRank(r){ return r.slice().sort(function(a,b){ return (tot(b) - tot(a)) || (a.t - b.t); }); }
function saveScore(n, kind, s){
  var r = loadRank(), key = n.toLowerCase(), f = null;
  r.forEach(function(x){ if(String(x.n).toLowerCase() === key) f = x; });
  if(!f){ f = {n:n, lit:0, num:0, t:Date.now()}; r.push(f); }
  if(s > (f[kind] || 0)) f[kind] = s;
  sset(RANKKEY, JSON.stringify(r));
  return r;
}
function resultHTML(){
  var r = saveScore(state.name, Q.kind, Q.score), sr = sortedRank(r), me = state.name.toLowerCase(), pos = 0;
  sr.forEach(function(x,k){ if(!pos && String(x.n).toLowerCase() === me) pos = k + 1; });
  var stars = Q.score >= 90 ? 3 : Q.score >= 60 ? 2 : Q.score >= 30 ? 1 : 0, st = '';
  for(var k = 0; k < 3; k++) st += (k < stars ? '⭐' : '☆');
  var msg = Q.score >= 80 ? 'Luar biasa! Kamu sudah mengerti.' : Q.score >= 50 ? 'Bagus! Ayo belajar lagi supaya makin pintar.' : 'Ayo belajar lagi di menu Belajar, lalu coba bermain lagi.';
  var again = Q.kind === 'num' ? 'playN' : 'playL';
  setTimeout(function(){ say(msg + ' Skormu ' + Q.score + '.'); }, 700);
  return '<div class="page ' + (Q.kind === 'num' ? 'bg5' : 'bg4') + '"><div class="panel" style="padding:24px 60px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px">' +
    '<div class="h1" style="font-size:48px">Selesai, ' + esc(state.name) + '! 🎉</div><div class="stars">' + st + '</div>' +
    '<div class="h1" style="font-size:56px">Skor: ' + Q.score + ' / ' + (Q.list.length * 10) + '</div>' +
    '<div class="lead">' + msg + '</div><div class="lead" style="font-size:26px;margin-bottom:14px">🏆 Peringkatmu: nomor ' + pos + ' dari ' + sr.length + '</div>' +
    '<div class="btnrow"><button class="btn primary big" data-act="' + again + '">🔁 Main Lagi</button><button class="btn orange big" data-act="rank">🏆 Peringkat</button><button class="btn big" data-act="home">🏠 Menu</button></div></div></div>';
}
function pageShell(title, inner, hint){
  return shell({bg:'bg1', prog:'<div class="ttl">' + title + '</div>', inner:inner, hint:hint || '', hideNext:true});
}
function rankHTML(){
  var r = sortedRank(loadRank()), me = (state.name || '').toLowerCase(), medals = ['🥇','🥈','🥉'];
  var body = r.length
    ? '<div class="rwrap"><div class="rbox"><div class="rhead"><span class="rk">No</span><span class="rn">Nama</span><span class="rc">Literasi</span><span class="rc">Numerasi</span><span class="rt">Total</span></div><div class="rtable" id="rt">' +
      r.map(function(x,k){ return '<div class="rrow' + (String(x.n).toLowerCase() === me ? ' me' : '') + '"><span class="rk">' + (k < 3 ? medals[k] : (k+1)) + '</span><span class="rn">' + esc(x.n) + '</span><span class="rc">' + (x.lit || 0) + '</span><span class="rc">' + (x.num || 0) + '</span><span class="rt">⭐ ' + tot(x) + '</span></div>'; }).join('') +
      '</div></div>' + (r.length > 8 ? '<div class="rbtns"><button class="btn" data-act="rup" aria-label="Naik">▲</button><button class="btn" data-act="rdown" aria-label="Turun">▼</button></div>' : '') + '</div>'
    : '<div class="empty">Belum ada skor.<br>Ayo bermain dulu di menu Bermain!</div>';
  return pageShell('🏆 Papan Peringkat (' + r.length + ' peserta)', body, r.length > 8 ? 'Tekan ▲ ▼ untuk melihat semua peserta' : 'Skor tersimpan di perangkat ini');
}
window.devErr = function(img){
  var l = ['./assets/pengembang.jpeg', './assets/pengembang.png'], i = +(img.getAttribute('data-i') || 0);
  if(i < l.length){ img.setAttribute('data-i', i + 1); img.src = l[i]; }
  else { img.style.display = 'none'; if(img.nextElementSibling) img.nextElementSibling.style.display = 'flex'; }
};
function devHTML(){
  return pageShell('👩‍🏫 Pengembang', '<div style="flex:1;display:flex;align-items:center;justify-content:center"><div class="dev">' +
    '<div class="photo"><img src="./assets/pengembang.jpg" alt="Foto pengembang Ade Suminarsih, S.Pd." onerror="devErr(this)"><div class="ph">👩‍🏫</div></div>' +
    '<div><div class="ds">Dikembangkan oleh</div><div class="dn">Ade Suminarsih, S.Pd.</div><div class="dp">PKBM Amanah Kita</div></div></div></div>', '');
}

/* ====== Event ====== */
function doStart(){
  var inp = $('#nm'); if(!inp) return;
  var v = inp.value.trim().replace(/\s+/g, ' ');
  if(!v){ var er = $('#err'); if(er) er.textContent = 'Tulis namamu dulu ya 😊'; shake(inp); return; }
  state.name = v; sset('mpi_pakaian_nama', v);
  toMenu('fwd');
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var a = t.dataset.act, S = steps();

  if(a === 'say'){ say(t.dataset.say); return; }
  if(a === 'mute'){
    music = !music; applyMute();
    if(music) resumeBgm(); else { try{ bgm.pause(); }catch(err){} }
    return;
  }
  if(a === 'full'){
    try{ var d = document, el = d.documentElement;
      if(d.fullscreenElement || d.webkitFullscreenElement){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
      else { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } }catch(err){}
    return;
  }
  if(a === 'cover'){
    if(busy) return;
    started = true; if(music && holds === 0) playEl(bgm);
    chrome(true); applyMute(); show(nameHTML(), 'fade');
    return;
  }
  if(a === 'key'){
    var ni = $('#nm'); if(!ni) return;
    var kk = t.dataset.k, nv = ni.value;
    if(kk === 'BS') nv = nv.slice(0,-1);
    else if(kk === 'CLR') nv = '';
    else if(kk === 'SP'){ if(nv.length && nv.slice(-1) !== ' ') nv += ' '; }
    else nv += (nv.length === 0 || nv.slice(-1) === ' ') ? kk : kk.toLowerCase();
    ni.value = nv.slice(0,20);
    var ne = $('#err'); if(ne) ne.textContent = '';
    return;
  }
  if(a === 'start'){ doStart(); return; }
  if(a === 'home'){ toMenu('back'); return; }
  if(a === 'rename'){ state.mode = ''; show(nameHTML(), 'back'); return; }
  if(a === 'learnL'){ startLearn('lit'); return; }
  if(a === 'learnN'){ startLearn('num'); return; }
  if(a === 'playL'){ startQuiz('lit'); return; }
  if(a === 'playN'){ startQuiz('num'); return; }
  if(a === 'rank'){ state.mode = 'page'; chrome(true); show(rankHTML(), 'fwd'); return; }
  if(a === 'dev'){ state.mode = 'page'; chrome(true); show(devHTML(), 'fwd'); return; }
  if(a === 'rup' || a === 'rdown'){
    var rt = $('#rt');
    if(rt){ var dy = (a === 'rup' ? -1 : 1) * 176; try{ rt.scrollBy({top:dy, behavior:'smooth'}); }catch(err){ rt.scrollTop += dy; } }
    return;
  }
  if(a === 'prev'){
    if(state.mode === 'learn' && state.step > 0) go(state.step - 1, 'back'); else toMenu('back');
    return;
  }
  if(a === 'next'){
    if(t.classList.contains('locked')){ shake($('#hint')); shake(t); return; }
    if(state.mode === 'learn'){
      if(state.step < S.length - 1) go(state.step + 1, 'fwd'); else toMenu('fwd');
    } else if(state.mode === 'quiz'){
      if(Q.i < Q.list.length - 1){ Q.i++; Q.answered = false; show(quizHTML(), 'fwd'); }
      else { state.mode = 'page'; show(resultHTML(), 'fwd'); }
    }
    return;
  }

  /* --- eksplorasi jenis dan kegunaan --- */
  if(a === 'food'){
    var it = byId[t.dataset.id], key = dk(state.step), st = S[state.step], set = EXSETS[st.set];
    if(!it) return;
    state.seen[key] = state.seen[key] || {}; state.seen[key][it.id] = 1;
    var cards = view.querySelectorAll('.card');
    for(var c = 0; c < cards.length; c++) cards[c].classList.remove('sel');
    t.classList.add('seen','sel');
    $('#info').innerHTML = ic('<span class="big">' + it.e + '</span><div class="itx"><div class="it-n">' + esc(it.n) + '<small>' + it.s + '</small><span class="tag">' + LOCE[it.loc] + ' ' + LOCN[it.loc] + '</span></div><div class="it-w">' + it.use + '</div></div>' + sayBtn(it.n + '. ' + it.use));
    say(it.n + '. ' + it.use);
    var n = Object.keys(state.seen[key]).length, cnt = $('#cnt'); if(cnt) cnt.textContent = n + '/' + set.ids.length;
    if(n >= set.ids.length && !state.done[key]){ state.done[key] = true; unlockNext('Hebat! Semua sudah dikenali. Tekan Lanjut ▶'); }
    return;
  }

  /* --- pilihan, benar/salah, studi kasus --- */
  if(a === 'opt'){
    var sk = dk(state.step), cs = S[state.step];
    if(state.done[sk] || t.classList.contains('no') || t.classList.contains('lock')) return;
    var o = cs.opts[+t.dataset.i];
    if(o.ok){
      var os = view.querySelectorAll('.opt'); for(var k = 0; k < os.length; k++) os[k].classList.add('lock');
      t.classList.add('ok'); state.done[sk] = true;
      setFb('good', '<b>Benar!</b> ' + o.why, o.why); unlockNext();
    } else {
      t.classList.add('no'); shake(t);
      setFb('bad', '<b>Belum tepat.</b> ' + o.why + ' Ayo coba lagi!', o.why + ' Ayo coba lagi!');
    }
    return;
  }
  if(a === 'qopt'){ onQuizOpt(t); return; }

  /* --- menjodohkan --- */
  if(a === 'mleft'){
    if(state.matched[t.dataset.id]) return;
    state.msel = t.dataset.id;
    var ls = view.querySelectorAll('[data-act="mleft"]'); for(var l = 0; l < ls.length; l++) ls[l].classList.remove('sel');
    t.classList.add('sel');
    setFb('neutral', 'Sekarang sentuh ' + S[state.step].kw + ' <b>' + esc(byId[t.dataset.id].n.toLowerCase()) + '</b> dipakai.');
    say(byId[t.dataset.id].n);
    return;
  }
  if(a === 'mright'){
    var rid = t.dataset.id;
    if(state.matched[rid]) return;
    if(!state.msel){ shake(t); setFb('neutral', 'Pilih pakaian dulu di sebelah kiri.'); return; }
    var ML = MATCHES[S[state.step].m], m = ML.filter(function(x){ return x.id === rid; })[0];
    if(state.msel === rid){
      state.matched[rid] = 1; state.msel = null;
      view.querySelector('.content').innerHTML = ic(RENDER.match(S[state.step]));
      var allm = ML.every(function(x){ return state.matched[x.id]; });
      if(allm){ state.done[dk(state.step)] = true; unlockNext(); }
      setFb('good', '<b>Benar!</b> ' + m.why, m.why);
    } else {
      shake(t);
      var wrong = byId[state.msel];
      setFb('bad', '<b>Belum tepat.</b> ' + esc(wrong.n) + ' bukan untuk ' + esc(m.n.toLowerCase()) + '. ' + wrong.use + ' Coba lagi!', wrong.n + ' bukan untuk ' + m.n.toLowerCase() + '. ' + wrong.use + ' Coba lagi!');
    }
    return;
  }

  /* --- berhitung dengan sentuhan --- */
  if(a === 'cnt'){
    var ck = dk(state.step), cst = S[state.step];
    var cc = state.cnt[ck] = state.cnt[ck] || {n:0, m:{}};
    var kidx = +t.dataset.k;
    if(cc.m[kidx]) return;
    cc.n++; cc.m[kidx] = cc.n;
    t.classList.add('on'); t.insertAdjacentHTML('beforeend', '<b class="cb">' + cc.n + '</b>');
    $('#bn').textContent = cc.n;
    if(cc.n >= cst.n){
      state.done[ck] = true;
      setFb('good', '<b>Hebat!</b> Ada ' + nw(cst.n) + ' ' + cst.name + '. Angka terakhir yang kamu sebut adalah jumlah semuanya.', 'Ada ' + nw(cst.n) + ' ' + cst.name + '. Angka terakhir yang kamu sebut adalah jumlah semuanya.');
      unlockNext();
    } else {
      say(nw(cc.n));
      setFb('neutral', 'Satu lagi! Sudah <b>' + nw(cc.n) + '</b>.');
    }
    return;
  }

  /* --- mengelompokkan --- */
  if(a === 'pick'){
    state.sel = t.dataset.id;
    var its = view.querySelectorAll('.item'); for(var m2 = 0; m2 < its.length; m2++) its[m2].classList.remove('sel');
    t.classList.add('sel');
    setFb('neutral', 'Sekarang sentuh keranjang yang tepat untuk <b>' + esc(byId[state.sel].n) + '</b>.');
    say(byId[state.sel].n);
    return;
  }
  if(a === 'bin'){
    if(!state.sel){ shake(t); setFb('neutral', 'Pilih gambar dulu ya, baru sentuh keranjang.'); return; }
    var item = byId[state.sel], v = t.dataset.v;
    var label = item.n + ' dipakai di ' + LOCN[item.loc].toLowerCase() + '. ';
    if(item.loc === v){
      state.placed[item.id] = 1; state.sel = null;
      view.querySelector('.content').innerHTML = ic(sortInner());
      var alld = SORTIDS.every(function(id){ return state.placed[id]; });
      if(alld){ state.done[dk(state.step)] = true; unlockNext(); }
      setFb('good', '<b>Benar!</b> ' + esc(label) + item.use, label + item.use + (alld ? ' Badan ada tiga pakaian. Kaki ada tiga pakaian.' : ''));
    } else {
      shake(t);
      setFb('bad', '<b>Belum tepat.</b> ' + esc(label) + ' Coba lagi!', label + ' Coba lagi!');
    }
    return;
  }

  /* --- pengalaman --- */
  if(a === 'chip'){
    var cid = t.dataset.id;
    state.picks[cid] = !state.picks[cid];
    t.classList.toggle('on', !!state.picks[cid]);
    var sm = $('#sum'); if(sm) sm.innerHTML = ic(expSummary());
    var any = EXPIDS.some(function(id){ return state.picks[id]; });
    if(any){ say(expSay()); if(!state.done[dk(state.step)]){ state.done[dk(state.step)] = true; unlockNext('Bagus! Ceritakan juga ke teman, lalu tekan Lanjut ▶'); } }
    return;
  }
});

/* ====== Mulai ====== */
applyMute();
show(coverHTML(), 'fade');
})();
</script>
</body>
</html>
